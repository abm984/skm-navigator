<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SKM Campus Navigator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{--bg:#0b1020;--panel:#0e1728e6;--line:#243352;--ink:#e8eef8;--muted:#8fa0bf;--faint:#5d6e8f;
    --accent:#3dd4a7;--build:#38bdf8;--route:#ffb020;--gps:#39d98a;--danger:#f4626b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);background:var(--bg);color:var(--ink)}
  #map{position:absolute;inset:0;background:#0b1020}
  .leaflet-container{background:#0b1020;font-family:var(--sans)}
  .searchwrap{position:absolute;top:10px;left:10px;right:10px;z-index:1100}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(12px);border-radius:13px;padding:11px 13px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .searchbar .mi{color:var(--faint);font-size:15px}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;min-width:0}
  .searchbar input::placeholder{color:var(--faint)}
  .searchbar .gps{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  .searchbar .gps.live{background:var(--gps);box-shadow:0 0 0 3px rgba(57,217,138,.2)}
  .results{margin-top:7px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
    border-radius:13px;overflow:hidden;max-height:54vh;overflow-y:auto;display:none;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .results.show{display:block}
  .rrow{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;border-bottom:1px solid #182238}
  .rrow:last-child{border-bottom:none}.rrow:active{background:#12203c}
  .rrow .ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
  .rrow .ic.b{background:#0e2a44;color:var(--build)}.rrow .ic.r{background:#1b2440;color:var(--faint)}
  .rrow .nm{flex:1;font-size:14px;line-height:1.25}.rrow .dist{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .rrow.head{cursor:default;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;padding:8px 13px;background:#0b1424}
  .status{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:1050;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:20px;padding:6px 14px;font-family:var(--mono);
    font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .status .sp{width:11px;height:11px;border:2px solid var(--faint);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-6px)}
  .fabs{position:absolute;right:11px;bottom:calc(var(--sheeth,120px) + 14px);z-index:1000;display:flex;flex-direction:column;gap:9px}
  .fab{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(10px);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fab:active{transform:scale(.94)}.fab.on{border-color:var(--accent);color:var(--accent)}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:linear-gradient(180deg,#0d1524f7,#0b1020);
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:9px 12px 13px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  .grip{width:38px;height:4px;border-radius:4px;background:#2a3a5c;margin:1px auto 9px}
  .navinfo{display:none;background:#0c1424;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .navinfo.show{display:block}
  .navinfo .row1{display:flex;align-items:baseline;gap:10px}
  .navinfo .big{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--route)}
  .navinfo .eta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .navinfo .to{font-size:13px;color:var(--ink);margin-top:3px}
  .navinfo .x{float:right;color:var(--muted);cursor:pointer;font-size:17px;padding:0 4px;margin:-2px}
  .navinfo .meta{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:5px}
  .menu-row{display:flex;gap:6px;margin-top:9px;align-items:center}
  .menu-row button{background:#0c1424;border:1px solid var(--line);color:var(--muted);border-radius:9px;
    padding:8px 10px;font-size:11px;font-family:var(--mono);cursor:pointer;flex:1}
  .menu-row button:active{border-color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-family:var(--mono);cursor:pointer;user-select:none;padding:6px 2px}
  .toggle .sw{width:34px;height:19px;border-radius:19px;background:#1a2440;border:1px solid var(--line);position:relative;transition:.2s}
  .toggle .sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:14px;height:14px;border-radius:50%;background:var(--faint);transition:.2s}
  .toggle.on .sw{background:#0e3226;border-color:var(--accent)}.toggle.on .sw::after{left:16px;background:var(--accent)}
  .hint{margin-top:7px;font-size:11px;color:var(--faint);font-family:var(--mono);line-height:1.5;min-height:15px}
  .toast{position:absolute;bottom:calc(var(--sheeth,120px) + 20px);left:50%;transform:translateX(-50%);z-index:1200;
    background:#0c1424;border:1px solid var(--line);padding:9px 15px;border-radius:10px;font-size:12px;font-family:var(--mono);
    opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:82%;text-align:center}
  .toast.show{opacity:1}
  .banner{position:absolute;top:60px;left:10px;right:10px;z-index:1100;background:#2a141c;border:1px solid var(--danger);
    color:#ffd9dd;border-radius:12px;padding:10px 13px;font-size:12px;line-height:1.5;display:none}.banner b{color:#ffb020}
  .leaflet-control-attribution{background:#0c1424cc!important;color:#5d6e8f!important;font-size:9px!important}
  .leaflet-control-attribution a{color:#8fa0bf!important}
  .leaflet-bar a{background:#0e1728!important;color:#e8eef8!important;border-color:#243352!important}
  .plabel{background:#0c1424e0;border:1px solid #2a3c5e;color:#dbe6f7;font-size:11px;padding:2px 7px;border-radius:7px;white-space:nowrap;font-weight:500}
  .plabel::before{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div class="searchwrap">
  <div class="searchbar">
    <span class="mi">&#128269;</span>
    <input id="search" placeholder="Search SKM — buildings, gates, offices…" autocomplete="off" />
    <span class="gps" id="gpsDot" title="GPS"></span>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="status" id="status"><span class="sp"></span><span id="statusTxt">Loading campus roads…</span></div>
<div class="banner" id="banner"></div>

<div class="fabs">
  <div class="fab" id="followBtn" title="Follow me">&#129517;</div>
  <div class="fab" id="locateBtn" title="Center on me">&#9673;</div>
</div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="navinfo" id="navinfo">
    <span class="x" id="navX">&#10005;</span>
    <div class="row1"><span class="big" id="navDist">—</span><span class="eta" id="navEta"></span></div>
    <div class="to" id="navTo"></div>
    <div class="meta" id="navMeta"></div>
  </div>
  <div class="hint" id="hint">Search or tap a place to route there along the campus roads from your GPS location.</div>
  <div class="menu-row">
    <div class="toggle" id="roadsToggle"><span class="sw"></span><span>Show roads</span></div>
    <button id="reloadRoads">↻ Reload roads</button>
  </div>
</div>

<div class="toast" id="toast"></div>

function hav(a,b){const R=6371000,r=Math.PI/180;const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;

async function fetchOSM(){
  const [s,w,n,e]=bbox();
  const q='[out:json][timeout:25];way["highway"]('+s+','+w+','+n+','+e+');out geom;';
  const endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  for(const url of endpoints){
    try{const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q)});
      if(!r.ok)continue;const j=await r.json();
      if(j&&j.elements&&j.elements.some(el=>el.type==='way'&&el.geometry))return j;
    }catch(e){}
  }
  return null;
}
function buildFromOSM(osm){
  const g=newGraph();let ways=0;
  for(const el of osm.elements){if(el.type!=='way'||!el.geometry||!el.nodes)continue;ways++;
    for(let i=0;i<el.nodes.length;i++){const p=el.geometry[i];addV(g,'w'+el.nodes[i],p.lat,p.lon);}
    for(let i=0;i<el.nodes.length-1;i++){const a='w'+el.nodes[i],b='w'+el.nodes[i+1];if(a!==b)addE(g,a,b);}}
  // attach landmarks: each becomes a vertex linked to its nearest road point
  let attached=0;
  LANDMARKS.forEach(lm=>{const ac=snap(g,lm);if(!ac)return;addV(g,lm.id,lm.lat,lm.lng);
    const wgt=hav(g.V.get(lm.id),g.V.get(ac.id));g.adj.get(lm.id).push({to:ac.id,w:wgt});g.adj.get(ac.id).push({to:lm.id,w:wgt});attached++;});
  return {g,ways,attached};
}
function buildFallback(){const g=newGraph();
  LANDMARKS.forEach(lm=>addV(g,lm.id,lm.lat,lm.lng));
  FALLBACK_EDGES.forEach(e=>{if(g.V.has(e.a)&&g.V.has(e.b))addE(g,e.a,e.b);});return g;}

/* ---- render (CLEAN: only place pins, roads optional, no routing dots) ---- */
function renderPins(){
  gPins.clearLayers();
  LANDMARKS.forEach(n=>{const isB=n.kind==='BUILDING'||n.type==='dest';
    if(!isB) return;                                   // roads: searchable only, not drawn
    const m=L.circleMarker([n.lat,n.lng],{radius:6,weight:2,color:'#0b1020',fillColor:'#38bdf8',fillOpacity:1}).addTo(gPins);
    m.on('click',ev=>{L.DomEvent.stop(ev);selectPlace(n);});
    m.bindTooltip(n.name,{permanent:true,direction:'right',className:'plabel',offset:[9,0]});
  });
}
function renderRoads(){gRoads.clearLayers();if(!showRoads||!G)return;
  const seen=new Set();
  G.seg.forEach(([a,b])=>{if(String(a).startsWith('__a')||String(b).startsWith('__a'))return;
    const A=G.V.get(a),B=G.V.get(b);const k=a<b?a+b:b+a;if(seen.has(k))return;seen.add(k);
    L.polyline([[A.lat,A.lng],[B.lat,B.lng]],{color:'#2f6d5b',weight:2,opacity:.5}).addTo(gRoads);});
}

/* ---- routing ---- */
function selectPlace(n){map.flyTo([n.lat,n.lng],18,{duration:.5});routeTo(n.id);}
function routeTo(destId){
  const dest=LANDMARKS.find(n=>n.id===destId);if(!dest||!G)return;
  let startId,startCoord,fromLabel,extraDist=0;
  if(gps){
    if(gpsAccess){/* previous gps access node left in graph is harmless */}
    const s=snap(G,gps);if(!s){toast('No road network to route on');return;}
    startId=s.id;startCoord=[gps.lat,gps.lng];extraDist=s.dist;fromLabel='your location';gpsAccess=s.id;
  } else {toast('Waiting for GPS fix—enable location');return;}
  const res=astar(G,startId,destId);
  if(!res){toast('No route found to this place');clearRoute();return;}
  const pts=res.path.map(id=>{const v=G.V.get(id);return [v.lat,v.lng];});
  gRoute.clearLayers();
  L.polyline([startCoord,...pts],{color:'#ffb020',weight:6,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(gRoute);
  routeCache={destId};showNav(dest.name,res.cost+extraDist,fromLabel);
}
function showNav(name,m,from){$('#navinfo').classList.add('show');
  $('#navDist').textContent=m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';
  $('#navEta').textContent='~'+Math.max(1,Math.round(m/1.35/60))+' min walk';
  $('#navTo').textContent='→ '+name;
  $('#navMeta').textContent='from '+from+(mode==='osm'?' · along campus roads':' · direct network (roads offline)');measure();}
function clearRoute(){gRoute.clearLayers();routeCache=null;$('#navinfo').classList.remove('show');measure();}
$('#navX').onclick=clearRoute;

/* ---- search ---- */
const searchEl=$('#search'),resultsEl=$('#results');
function renderResults(q){q=(q||'').trim().toLowerCase();let list=LANDMARKS.filter(n=>n.name);
  if(q)list=list.filter(n=>n.name.toLowerCase().includes(q));
  if(gps)list=list.map(n=>({n,d:hav(gps,n)})).sort((a,b)=>a.d-b.d);else list=list.map(n=>({n,d:null}));
  list=list.slice(0,30);if(!list.length){resultsEl.classList.remove('show');return;}
  resultsEl.innerHTML='<div class="rrow head">'+(q?'Matches':(gps?'Nearest to you':'All places'))+'</div>'+
    list.map(({n,d})=>{const b=n.kind==='BUILDING'||n.type==='dest';
      return '<div class="rrow" data-id="'+n.id+'"><div class="ic '+(b?'b':'r')+'">'+(b?'◆':'•')+'</div>'+
        '<div class="nm">'+esc(n.name)+'</div>'+(d!=null?'<div class="dist">'+(d>=1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m')+'</div>':'')+'</div>';}).join('');
  resultsEl.classList.add('show');
  resultsEl.querySelectorAll('.rrow[data-id]').forEach(r=>r.onclick=()=>{const n=LANDMARKS.find(x=>x.id===r.dataset.id);
    resultsEl.classList.remove('show');searchEl.value=n.name;searchEl.blur();selectPlace(n);});}
searchEl.addEventListener('input',e=>renderResults(e.target.value));
searchEl.addEventListener('focus',()=>renderResults(searchEl.value));
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))resultsEl.classList.remove('show');});
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- GPS ---- */
function startGPS(){if(!('geolocation' in navigator)){showBanner('This browser has no geolocation.');return;}
  if(!window.isSecureContext)showBanner('GPS needs <b>https</b> (GitHub Pages) or <b>localhost</b>. Phones block location on plain http.');
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});}
function onPos(p){gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
  $('#gpsDot').classList.add('live');hideBanner();drawGPS();if(follow)map.setView([gps.lat,gps.lng]);if(routeCache)throttle();}
function onErr(e){$('#gpsDot').classList.remove('live');if(e.code===1)showBanner('Location permission denied. Allow location for this site, then reload.');}
let rt=null;function throttle(){clearTimeout(rt);rt=setTimeout(()=>{if(routeCache)routeTo(routeCache.destId);},2500);}
function drawGPS(){const ll=[gps.lat,gps.lng];
  if(!gpsMarker){gpsCircle=L.circle(ll,{radius:gps.acc,color:'#39d98a',weight:1,fillColor:'#39d98a',fillOpacity:.1}).addTo(map);
    gpsMarker=L.circleMarker(ll,{radius:7,color:'#0b1020',weight:3,fillColor:'#39d98a',fillOpacity:1}).addTo(map);}
  else{gpsMarker.setLatLng(ll);gpsCircle.setLatLng(ll).setRadius(gps.acc);}}
$('#locateBtn').onclick=()=>{if(gps)map.setView([gps.lat,gps.lng],18);else toast('No GPS fix yet');};
$('#followBtn').onclick=()=>{follow=!follow;$('#followBtn').classList.toggle('on',follow);if(follow&&gps)map.setView([gps.lat,gps.lng]);};

/* ---- roads toggle / reload ---- */
$('#roadsToggle').onclick=()=>{showRoads=!showRoads;$('#roadsToggle').classList.toggle('on',showRoads);renderRoads();};
$('#reloadRoads').onclick=()=>loadRoads(true);

/* ---- boot ---- */
async function loadRoads(force){
  setStatus(true,'Loading campus roads…');
  const osm=await fetchOSM();
  if(osm){const {g,ways,attached}=buildFromOSM(osm);G=g;mode='osm';
    setStatus(false,ways+' roads mapped');renderRoads();
    toast('Campus roads loaded ('+ways+' ways)');}
  else{G=buildFallback();mode='offline';setStatus(false,'roads offline — using direct links');
    showBanner('Could not load OpenStreetMap roads (offline or not mapped). Using the direct landmark network for now. Tap <b>Reload roads</b> when back online.');}
  if(routeCache)routeTo(routeCache.destId);
}
function setStatus(spin,txt){const s=$('#status');$('#statusTxt').textContent=txt;
  s.querySelector('.sp').style.display=spin?'':'none';s.classList.remove('hide');
  if(!spin){clearTimeout(s._t);s._t=setTimeout(()=>s.classList.add('hide'),2600);}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function showBanner(h){const b=$('#banner');b.innerHTML=h;b.style.display='block';}
function hideBanner(){$('#banner').style.display='none';}
function measure(){document.documentElement.style.setProperty('--sheeth',$('#sheet').offsetHeight+'px');}
window.addEventListener('resize',measure);

renderPins();
map.fitBounds(L.latLngBounds(LANDMARKS.map(n=>[n.lat,n.lng])).pad(.15));
measure();startGPS();loadRoads();
</script>
